# Global config: design tokens (CSS custom properties) + base styles. Component CSS is attached
# automatically by SDC when a component is rendered, so it is not listed here.
global:
  css:
    base:
      dist/css/tokens.css: {}
      dist/css/themes/ocean.css: {}
      dist/css/themes/sunset.css: {}
      dist/css/themes/forest.css: {}
      dist/css/themes/plum.css: {}
      dist/css/themes/dusk.css: {}
      styles/base.css: {}
      styles/typography.css: {}
