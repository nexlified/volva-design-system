$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Checkbox
status: stable
description: Labelled checkbox with help / error text.
props:
  type: object
  properties:
    id: { type: string }
    name: { type: string }
    label: { type: string }
    value: { type: string }
    checked: { type: boolean, default: false }
    help: { type: string }
    error: { type: string }
    disabled: { type: boolean, default: false }
