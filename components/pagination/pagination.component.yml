$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Pagination
status: stable
description: Page navigation. Flutter apps typically use infinite scroll; this is a web-only component.
props:
