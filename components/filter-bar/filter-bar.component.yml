$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Filter bar
status: stable
description: Horizontal chip filters with result count and sort. Flutter parity - VdsFilterBar.
props:
  type: object
  properties:
    filters:
      type: array
      items: { type: object, properties: { label: { type: string }, href: { type: string }, active: { type: boolean } } }
    result_count: { type: integer }
    sort_label: { type: string, default: Sort by relevance }
